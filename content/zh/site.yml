research:
  - id: complete-monitoring
    title: 完全监控
    category: 渐进类型 · 类型完整性
    body: |
      目前，我的研究围绕[完全监控（Complete Monitoring）](https://www2.ccs.neu.edu/racket/pubs/esop12-dthf.pdf)展开。这一性质使用所有权标注及其传播规则，对渐进类型系统中值的流动进行形式化描述，从而帮助评估：在运行时发生类型不匹配时，责任归因是否准确地指向了应负责的程序组件。

      我提出了新的句法技术，通过引入收集语义（collecting semantics）来消除对所有权标注的依赖，并严格证明了这一方法保持程序行为不变。未来的重点是进一步完善收集语义，用统一的规则描述内存位置与其必须满足的类型之间的关联，从而不仅能够跟踪，还能够强制保证程序的类型完整性。
  - id: dynamic-semantics
    title: 动态语义
    category: 类型历史 · 运行时检查
    body: |
      在此基础上，我正在研究一种高阶动态语义，以便及早检查每个值的类型历史中是否存在不一致。与 [Amnesic 语义](https://www2.ccs.neu.edu/racket/pubs/oopsla19-gfd.pdf)不同，这一方法将类型历史编码在内存中，而不是显式记录在表达式里。

      这种策略使新的语义更加高效：类型历史在求值过程中增量更新，只有当类型不匹配实际发生时，才进行解码和检查。
  - id: parallelizing-compilers
    title: 并行化编译器
    category: 程序分析 · NOELLE
    body: |
      此前，我在 [NOELLE](https://github.com/arcana-lab/noelle) 项目中从事并行化编译器研究，目标是将程序映射到多核平台上，以获得可观的加速。具体而言，我实现了一种新的过程内可能指向分析（intraprocedural may points-to analysis），并将其集成到私有化转换器中。该转换器在保持程序语义的前提下，将动态内存分配和全局变量转换为局部变量，从而支持原本仅适用于 AllocaInst 的程序变换。

      此外，这项可能指向分析还帮助消除了程序依赖图中过于保守的循环携带内存依赖，减少了不必要的同步，从而获得更高的并行加速比。
