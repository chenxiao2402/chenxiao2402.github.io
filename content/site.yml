research:
  - id: complete-monitoring
    title: Complete monitoring
    category: Gradual typing · Type integrity
    body: |
      Currently, my research revolves around [Complete Monitoring](https://www2.ccs.neu.edu/racket/pubs/esop12-dthf.pdf), a property that formalizes the flow of values in gradual typing systems using ownership annotations and propagation rules for ownership to help assess the quality of blame assignments for responsible components when a runtime type mismatch occurs. I've derived new syntactic techniques that help eliminate the necessity for ownership annotations by introducing collecting semantics, along with the rigorous proof to show the program behavior is preserved. The main focus in the future is to enhance the collecting semantics based on uniform rules about how locations are associated with types they must satisfy, so that we could not only track but also enforce the type integrity of the program.
  - id: dynamic-semantics
    title: Dynamic semantics
    category: Type history · Runtime checking
    body: |
      Therefore, I'm working on a high-order dynamic semantics that could eagerly check inconsistency in the typing history of each value. Different from the [Amnesic](https://www2.ccs.neu.edu/racket/pubs/oopsla19-gfd.pdf) semantics, the type history is encoded in the memory instead of being explicitly recorded in the expression. This strategy makes this new semantics more efficient because the type history will be incrementally updated during evaluation, while being decoded and checked only when type mismatch actually happens.
  - id: parallelizing-compilers
    title: Parallelizing compilers
    category: Program analysis · NOELLE
    body: |
      Previously, I worked on parallelizing compilers in the [NOELLE](https://github.com/arcana-lab/noelle) project, with the goal of mapping programs to a multicore platform gaining nontrivial speedup. Specifically, I implemented a new intraprocedural may points-to analysis, and integrated it into a privatizer that converts dynamic memory allocations and global variables into local variables while preserving program semantics to enable transformations only applicable to AllocaInsts.

      In addition, this may points-to analysis helped remove overly conservative loop-carried memory dependencies in the program dependence graph to eliminate unnecessary synchronizations and achieve higher speedup for parallelization.
